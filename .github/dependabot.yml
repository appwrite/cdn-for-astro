version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # Routine dev tooling churn is not worth one pull request per package.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # `astro` is a peer dependency: the supported range is a deliberate
      # decision, not something to bump automatically.
      - dependency-name: astro
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /examples/basic
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - example

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions
